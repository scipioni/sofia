# go-task task runner — https://taskfile.dev
#
#   task            list every task
#   task up:rocm    build and run the stack on an AMD GPU
#
# Anything after `--` is passed through, e.g. `task test -- -k realtime -v`.
version: "3"

dotenv: [".env"]

silent: true

vars:
  COMPOSE: docker compose -f compose.yaml
  QAA_URL: http://localhost:{{.SOFIA_QAA_HOST_PORT | default "8000"}}
  TTS_URL: http://localhost:8200

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  # ------------------------------------------------------------------ local ---

  setup:
    desc: Create a local venv with every extra installed
    cmds:
      - uv venv
      - uv pip install -e '.[s2s,qaa,audio,dev]'
    sources:
      - pyproject.toml
    generates:
      - .venv/pyvenv.cfg

  lint:
    desc: Ruff check + format check
    cmds:
      - uv run ruff check src tests
      - uv run ruff format --check src tests

  fmt:
    desc: Autoformat and autofix
    cmds:
      - uv run ruff check --fix src tests
      - uv run ruff format src tests

  test:
    desc: Run the test suite (task test -- -k realtime -v)
    cmds:
      - uv run pytest {{.CLI_ARGS | default "-q"}}

  check:
    desc: Everything CI would run
    cmds:
      - task: lint
      - task: test

  # ----------------------------------------------------------------- docker ---

  up:nvidia:
    desc: Build and run the whole stack on an NVIDIA GPU
    cmds:
      - task: _up
        vars: { OVERLAY: "-f compose.nvidia.yaml", VARIANT: "nvidia" }

  up:rocm:
    desc: Build and run the whole stack on an AMD GPU
    cmds:
      - task: _up
        vars: { OVERLAY: "-f compose.rocm.yaml", VARIANT: "rocm" }

  up:cpu:
    desc: Build and run on CPU (slower, but needs no GPU at all)
    cmds:
      - task: _up
        vars: { OVERLAY: "", VARIANT: "cpu" }

  up:rocm:dev:
    desc: Like up:rocm, but with compose.dev.yaml's bind-mount + hot reload
    cmds:
      - task: _up
        vars: { OVERLAY: "-f compose.rocm.yaml -f compose.dev.yaml", VARIANT: "rocm-dev" }

  up:nvidia:dev:
    desc: Like up:nvidia, but with compose.dev.yaml's bind-mount + hot reload
    cmds:
      - task: _up
        vars: { OVERLAY: "-f compose.nvidia.yaml -f compose.dev.yaml", VARIANT: "nvidia-dev" }

  up:cpu:dev:
    desc: Like up:cpu, but with compose.dev.yaml's bind-mount + hot reload
    cmds:
      - task: _up
        vars: { OVERLAY: "-f compose.dev.yaml", VARIANT: "cpu-dev" }

  _up:
    internal: true
    cmds:
      # models/hf-cache are host bind mounts (browseable, path set via
      # SOFIA_MODELS_HOST_DIR / SOFIA_HF_CACHE_HOST_DIR in .env), not Docker
      # volumes — Docker won't auto-chown a bind mount to the container's uid
      # the way it does a freshly-created named volume, so a directory it
      # auto-creates for a missing path comes back root-owned and the
      # container's non-root user can't write into it. Doing it here once,
      # up front, means every `task up:*` just works.
      #
      # Non-recursive: after the first run these directories are populated
      # with files the container's non-root uid owns, and this host user
      # can't chmod files it doesn't own (nor does it need to — the
      # container manages permissions within its own subtree once it can
      # write into the top-level directory at all). `chmod -R` here used to
      # fail on every run after the first for exactly that reason.
      - mkdir -p "${SOFIA_MODELS_HOST_DIR:-./data/models}" "${SOFIA_HF_CACHE_HOST_DIR:-./data/hf-cache}"
      - chmod a+rwX "${SOFIA_MODELS_HOST_DIR:-./data/models}" "${SOFIA_HF_CACHE_HOST_DIR:-./data/hf-cache}"
      - task: _build
        vars: { OVERLAY: "{{.OVERLAY}}", VARIANT: "{{.VARIANT}}" }
      # No --build here: _build above already brought every image up to date
      # (or skipped, if nothing relevant changed) and invoking the builder
      # again here would pay its cache-lookup/export cost a second time for
      # nothing. Plain `up` builds automatically only if an image is entirely
      # missing, which never happens once _build has run.
      #
      # -d (detached): a foreground `up` never exits on its own — it just
      # follows logs forever — which makes it easy to mistake for a stuck or
      # stale process days later and kill it, taking the whole stack down
      # with it (containers with restart:unless-stopped survive their own
      # crash, but not their parent CLI being killed while still attached in
      # this mode). Detached avoids that failure mode entirely; `task logs`
      # still follows logs on demand.
      - "{{.COMPOSE}} {{.OVERLAY}} up -d"

  _build:
    internal: true
    vars:
      # One marker per accelerator+dev combination — VARIANT, not OVERLAY, so
      # the on-disk name doesn't need shell-escaping the "-f x.yaml" syntax.
      MARKER: ".task/built-{{.VARIANT}}"
    # Task considers itself up-to-date (and skips cmds) only if every status
    # command exits 0. First: the marker from a previous successful build
    # must exist. Second: nothing this build actually depends on may be newer
    # than that marker — `find -newer` lists any such file; `grep -q .` turns
    # "found at least one" into exit 0, and `!` flips that to failure (rebuild
    # needed) while "found nothing" (truly unchanged) flips to success (skip).
    # This is what makes `task up:rocm` a no-op against the builder entirely
    # when only, say, docs or an unrelated compose overlay changed — not just
    # a fast rebuild, no builder invocation at all.
    status:
      - test -f {{.MARKER}}
      - >-
        sh -c '! find docker compose.yaml compose.rocm.yaml compose.nvidia.yaml
        compose.dev.yaml pyproject.toml uv.lock src -newer {{.MARKER}} -print -quit
        | grep -q .'
    cmds:
      - mkdir -p .task
      - "{{.COMPOSE}} {{.OVERLAY}} build"
      - touch {{.MARKER}}

  down:
    desc: Stop everything
    cmds:
      - "{{.COMPOSE}} down"

  logs:
    desc: Follow logs (task logs -- s2s)
    cmds:
      - "{{.COMPOSE}} logs -f {{.CLI_ARGS}}"

  config:
    desc: Validate every compose file combination
    # Placeholders satisfy the `:?` guards in compose.yaml, so this checks the
    # file structure without needing a real .env.
    env:
      LIVEKIT_URL: ws://placeholder
      LIVEKIT_API_KEY: placeholder
      LIVEKIT_API_SECRET: placeholder
      SOFIA_QAA_LLM_BASE_URL: http://placeholder/v1
      SOFIA_QAA_LLM_MODEL: placeholder
    cmds:
      - for: ["", "-f compose.nvidia.yaml", "-f compose.rocm.yaml"]
        cmd: "{{.COMPOSE}} {{.ITEM}} config -q && echo 'ok: compose.yaml {{.ITEM}}'"

  # ----------------------------------------------------------------- probes ---

  console:
    desc: Talk to the agent from your terminal, no LiveKit room needed
    cmds:
      - uv run sofia-s2s console

  ask:
    desc: Ask the brain one question over HTTP (task ask Q="che ore sono?")
    vars:
      Q: '{{.Q | default "who are you?"}}'
    cmds:
      - |
        curl -sS {{.QAA_URL}}/v1/chat/completions \
          -H 'content-type: application/json' \
          -d '{"model":"sofia-qaa","messages":[{"role":"user","content":"{{.Q}}"}]}' \
          | python3 -m json.tool

  say:
    desc: Synthesise a sentence to out.wav (task say T="ciao")
    vars:
      T: '{{.T | default "Hello from Sofia."}}'
      VOICE: '{{.VOICE | default "af_heart"}}'
    cmds:
      - |
        curl -sS {{.TTS_URL}}/v1/audio/speech \
          -H 'content-type: application/json' \
          -d '{"model":"kokoro","input":"{{.T}}","voice":"{{.VOICE}}","response_format":"wav"}' \
          -o out.wav
      - echo "wrote out.wav"
