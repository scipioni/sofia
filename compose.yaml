# Base topology. Defaults to CPU inference so it runs anywhere.
# Pick an accelerator by layering an overlay on top:
#
#   docker compose -f compose.yaml -f compose.nvidia.yaml up --build
#   docker compose -f compose.yaml -f compose.rocm.yaml   up --build
#
# (or just `task up:nvidia` / `task up:rocm`)
name: sofia-galileo

services:
  # ---------------------------------------------------------------- the brain
  qaa-agent:
    build:
      context: .
      dockerfile: docker/qaa.Dockerfile
    image: sofia-galileo/qaa-agent:local
    restart: unless-stopped
    environment:
      SOFIA_QAA_PORT: 8000
      SOFIA_QAA_LOG_LEVEL: ${SOFIA_LOG_LEVEL:-INFO}
      # Your OpenAI-compatible LLM. host.docker.internal reaches a server running
      # on the host; use a URL or a compose service name for anything else.
      SOFIA_QAA_LLM_BASE_URL: ${SOFIA_QAA_LLM_BASE_URL:?set your OpenAI-compatible LLM endpoint}
      SOFIA_QAA_LLM_API_KEY: ${SOFIA_QAA_LLM_API_KEY:-not-needed}
      SOFIA_QAA_LLM_MODEL: ${SOFIA_QAA_LLM_MODEL:?set the upstream model name}
      SOFIA_QAA_SERVED_MODEL_NAME: sofia-qaa
      SOFIA_QAA_MAX_TOKENS: ${SOFIA_QAA_MAX_TOKENS:-320}
      SOFIA_QAA_TEMPERATURE: ${SOFIA_QAA_TEMPERATURE:-0.6}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Exposed on loopback only — handy for `curl`, not meant for the network.
      # Override SOFIA_QAA_HOST_PORT in .env if 8000 is taken on the host.
      - "127.0.0.1:${SOFIA_QAA_HOST_PORT:-8000}:8000"
    networks: [sofia]

  # ------------------------------------------------------------ speech to text
  stt:
    build:
      context: .
      dockerfile: docker/audio.Dockerfile
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        WITH_ROCRAND_HEADERS: without-rocrand
    image: sofia-galileo/audio:${ACCEL:-cpu}
    command: ["sofia-stt"]
    restart: unless-stopped
    environment:
      SOFIA_STT_PORT: 8100
      SOFIA_STT_LOG_LEVEL: ${SOFIA_LOG_LEVEL:-INFO}
      # batch (Whisper) | streaming (sherpa-onnx) | both
      SOFIA_STT_BACKEND: ${SOFIA_STT_BACKEND:-both}
      # nemotron (default) or whisper — must match SOFIA_STT_MODEL_ID
      SOFIA_STT_BATCH_ENGINE: ${SOFIA_STT_BATCH_ENGINE:-nemotron}
      SOFIA_STT_MODEL_ID: ${SOFIA_STT_MODEL_ID:-nvidia/nemotron-3.5-asr-streaming-0.6b}
      SOFIA_STT_DEFAULT_LANGUAGE: ${SOFIA_LANGUAGE:-it}
      SOFIA_STT_DEVICE: ${SOFIA_AUDIO_DEVICE:-auto}
      # parakeet (default — Nemotron via parakeet.cpp — punctuated, cased,
      # covers Italian; needs a Vulkan- or CUDA-capable build of docker/audio.Dockerfile)
      # sherpa (no Italian, no punctuation)
      SOFIA_STT_STREAMING_ENGINE: ${SOFIA_STT_STREAMING_ENGINE:-parakeet}
      SOFIA_STT_SHERPA_MODEL_URL: ${SOFIA_STT_SHERPA_MODEL_URL:-https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-en-2023-06-26.tar.bz2}
      SOFIA_STT_SHERPA_RULE2_MIN_TRAILING_SILENCE: ${SOFIA_STT_ENDPOINT_SILENCE:-0.8}
      SOFIA_STT_PARAKEET_MODEL_URL: ${SOFIA_STT_PARAKEET_MODEL_URL:-https://huggingface.co/mudler/parakeet-cpp-gguf/resolve/main/nemotron-3.5-asr-streaming-0.6b-f16.gguf}
      # Same knob as sherpa's rule2 above, conceptually: how much trailing
      # silence after speech ends a turn. Nemotron has no end-of-utterance
      # signal of its own (see openspec/changes/add-parakeet-streaming-asr),
      # so ParakeetSession implements this rule itself rather than relying on
      # the model.
      SOFIA_STT_PARAKEET_ENDPOINT_SILENCE: ${SOFIA_STT_ENDPOINT_SILENCE:-0.8}
    volumes:
      # Host-browseable directories, not Docker-managed volumes — you can `ls`
      # what got downloaded. Bind-mounted, so unlike a named volume Docker will
      # NOT auto-chown these to the container's uid on first use; `task up:*`
      # creates them and opens permissions before starting the stack (see
      # Taskfile.yml `_up`) — if you start containers another way, do the same
      # (`mkdir -p` + `chmod -R a+rwX` the two paths below) or writes fail.
      - ${SOFIA_HF_CACHE_HOST_DIR:-./data/hf-cache}:/home/sofia/.cache/huggingface
      - ${SOFIA_MODELS_HOST_DIR:-./data/models}:/home/sofia/models
      # MIOpen (AMD) JIT-compiles kernels per tensor shape; persisting the cache
      # means each shape costs seconds once per deployment, not per boot. The
      # directory is simply unused on CPU/NVIDIA builds. Left as a named
      # volume, not a bind mount: it holds compiled kernel blobs, not models —
      # nothing worth browsing, and no reason to take on the ownership caveat
      # above for it.
      - miopen-cache:/home/sofia/.cache/miopen
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8100/healthz"]
      interval: 15s
      timeout: 5s
      # Generous: the first boot downloads model weights (~1.3 GB for Nemotron).
      start_period: 600s
      retries: 5
    ports:
      # Loopback only, for curl / the `task say` / `task ask` helpers.
      - "127.0.0.1:${SOFIA_STT_HOST_PORT:-8100}:8100"
    networks: [sofia]

  # ------------------------------------------------------------ text to speech
  tts:
    build:
      context: .
      dockerfile: docker/audio.Dockerfile
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        WITH_ROCRAND_HEADERS: without-rocrand
    image: sofia-galileo/audio:${ACCEL:-cpu}
    command: ["sofia-tts"]
    restart: unless-stopped
    environment:
      SOFIA_TTS_PORT: 8200
      SOFIA_TTS_LOG_LEVEL: ${SOFIA_LOG_LEVEL:-INFO}
      SOFIA_TTS_DEFAULT_VOICE: ${SOFIA_TTS_VOICE:-af_heart}
      SOFIA_TTS_DEVICE: ${SOFIA_AUDIO_DEVICE:-auto}
      # Works around a known ROCm HSA runtime bug (AsyncEventsLoop busy-spin):
      # the pip-bundled ROCm runtime's background event thread spins at 100%
      # of one CPU core indefinitely after any GPU op, even fully idle. This
      # is the only service that showed it (stt, on the same runtime, did
      # not) — confirmed fixed in a standalone container: CPU dropped from
      # ~100% to ~0.1% at idle with this set, synthesis still correct.
      GPU_MAX_HW_QUEUES: 1
    volumes:
      - ${SOFIA_HF_CACHE_HOST_DIR:-./data/hf-cache}:/home/sofia/.cache/huggingface
      - miopen-cache:/home/sofia/.cache/miopen
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8200/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 300s
      retries: 5
    ports:
      # Loopback only, for curl / the `task say` helper.
      - "127.0.0.1:${SOFIA_TTS_HOST_PORT:-8200}:8200"
    networks: [sofia]

  # ------------------------------------------------------- the LiveKit worker
  s2s:
    build:
      context: .
      dockerfile: docker/s2s.Dockerfile
    image: sofia-galileo/s2s:local
    restart: unless-stopped
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:?set your LiveKit server URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set your LiveKit API key}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set your LiveKit API secret}

      SOFIA_S2S_LOG_LEVEL: ${SOFIA_LOG_LEVEL:-INFO}
      SOFIA_S2S_LANGUAGE: ${SOFIA_LANGUAGE:-it}
      SOFIA_S2S_AGENT_NAME: ${SOFIA_S2S_AGENT_NAME:-}

      SOFIA_S2S_QAA_BASE_URL: http://qaa-agent:8000/v1
      SOFIA_S2S_STT_BASE_URL: http://stt:8100/v1
      # true -> streaming ASR over ws://stt:8100/v1/realtime
      SOFIA_S2S_STT_USE_REALTIME: ${SOFIA_STT_STREAMING:-true}
      SOFIA_S2S_TTS_BASE_URL: http://tts:8200/v1
      SOFIA_S2S_TTS_VOICE: ${SOFIA_TTS_VOICE:-if_sara}
      # Floor and ceiling for the semantic turn detector, in seconds. The
      # ceiling is the one that bites: an uncertain semantic model waits up to
      # this long before deciding the person is done — measured stalling a
      # real turn to its full 5.0s default (see docs/benchmark.md). Lower for
      # a more reactive agent; the trade-off is a higher chance of cutting
      # someone off mid-thought on a genuinely ambiguous pause.
      SOFIA_S2S_MIN_ENDPOINTING_DELAY: ${SOFIA_S2S_MIN_ENDPOINTING_DELAY:-0.4}
      SOFIA_S2S_MAX_ENDPOINTING_DELAY: ${SOFIA_S2S_MAX_ENDPOINTING_DELAY:-5.0}
    depends_on:
      stt:
        condition: service_healthy
      tts:
        condition: service_healthy
      qaa-agent:
        condition: service_healthy
    networks: [sofia]

networks:
  sofia:
    driver: bridge

volumes:
  # hf-cache and models are bind mounts now (see the stt/tts service comments
  # above), not declared here — only miopen-cache is still Docker-managed.
  miopen-cache:
