[project]
name = "sofia-galileo"
version = "0.1.0"
description = "Vocal agent that joins LiveKit rooms, listens and speaks with humans."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
]

[project.optional-dependencies]
# s2s.service — LiveKit worker. Pure Python/HTTP: no GPU, no model weights.
s2s = [
    "livekit-agents[openai,silero,turn-detector]~=1.0",
    "openai>=1.55",
]

# qaa-agent.service — the OpenAI-compatible "brain". No GPU either.
qaa = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "openai>=1.55",
]

# stt/tts services — the only GPU-bound part. torch is NOT listed here: the
# Dockerfiles install the cu126, rocm7.2 or cpu wheel explicitly before this extra.
audio = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    # >=5.13 is where Nemotron 3.5 ASR landed natively (no trust_remote_code).
    "transformers>=5.13",
    "accelerate>=1.0",
    "sherpa-onnx>=1.12",
    "librosa>=0.10",
    "kokoro>=0.9",
    "soundfile>=0.12",
    "numpy>=1.26",
    # Streaming (frame-by-frame) resampling for the parakeet.cpp path: its
    # ResampleStream carries the filter delay line across calls, which a
    # stateless per-frame resample would not (see streaming.py ParakeetSession).
    "soxr>=0.4",
]

dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
sofia-s2s = "sofia_galileo.s2s.__main__:main"
sofia-qaa = "sofia_galileo.qaa.__main__:main"
sofia-stt = "sofia_galileo.audio.__main__:main_stt"
sofia-tts = "sofia_galileo.audio.__main__:main_tts"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sofia_galileo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF", "BLE", "SLF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
packages = ["sofia_galileo"]
ignore_missing_imports = true
